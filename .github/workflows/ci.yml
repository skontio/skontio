name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: SKONTIO_DEBUG=1 uv run skontio makemigrations --check --dry-run

  test:
    name: test (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: skontio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: WeasyPrint system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Postgres client 18 for backup tests (pg_dump must be >= server)
        if: matrix.database == 'postgres'
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Official e-invoice validators (KoSIT, Mustang/veraPDF)
        run: tools/validators/fetch.sh
      - run: uv sync --frozen
      - name: pytest
        env:
          SKONTIO_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:test@localhost:5432/skontio' || 'sqlite:///skontio.sqlite3' }}
          SKONTIO_PG_BIN_DIR: /usr/lib/postgresql/18/bin
        run: uv run pytest --cov=skontio --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: skontio:ci
      - name: Smoke test (read-only, UID 568)
        run: |
          mkdir -p ci/data ci/archive ci/backups && chmod -R 777 ci
          docker run -d --name smoke --user 568:568 --read-only --tmpfs /tmp --cap-drop ALL \
            -e SKONTIO_SECRET_KEY=ci-smoke -e SKONTIO_ALLOWED_HOSTS=127.0.0.1 \
            -v "$PWD/ci/data:/data" -v "$PWD/ci/archive:/archive" -v "$PWD/ci/backups:/backups" \
            -p 127.0.0.1:8000:8000 skontio:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz && exit 0; sleep 1; done
          docker logs smoke; exit 1
