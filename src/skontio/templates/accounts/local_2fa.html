{% load static skontio_ui %}<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Skontio – Bestätigungscode</title>
<link rel="stylesheet" href="{% asset 'web/theme.css' %}">
<link rel="stylesheet" href="{% asset 'web/app.css' %}">{% custom_theme %}
</head>
<body>
<main class="auth">
  <div class="sheet">
    <span class="brand">Skontio</span>
    <h1>Bestätigungscode</h1>
    <p class="muted">Code aus der Authenticator-App oder einen Wiederherstellungscode eingeben.</p>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <p><label for="code">Code</label> <input id="code" name="code" autocomplete="one-time-code" inputmode="text" autofocus required></p>
      <button type="submit">Bestätigen</button>
    </form>
  </div>
</main>
</body>
</html>
