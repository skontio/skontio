{% extends "web/base.html" %}
{% block title %}Vorlage {{ template.name }}{% endblock %}
{% block content %}
<div class="heading"><h1>Vorlage „{{ template.name }}“</h1><a class="button secondary" href="/einstellungen/vorlagen/">Alle Vorlagen</a></div>
{% if logo %}<p>Aktuelles Logo: <img class="logo-preview" src="{{ logo }}" alt="Logo"></p>{% endif %}
<form method="post" enctype="multipart/form-data" class="form">
  {% csrf_token %}
  {% include "web/_fields.html" %}
  <button type="submit">Speichern</button>
</form>
{% endblock %}
