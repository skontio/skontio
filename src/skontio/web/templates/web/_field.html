{% if field.is_hidden %}{{ field }}{% else %}<div class="field{% if field.errors %} has-error{% endif %}{% if field.widget_type == 'checkbox' %} is-check{% endif %}">
  {% if field.widget_type == "checkbox" %}<label class="check" for="{{ field.id_for_label }}">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}{% endif %}
  {% if field.help_text %}<small id="{{ field.auto_id }}_help">{{ field.help_text }}</small>{% endif %}
  {% for e in field.errors %}<p class="error" id="{{ field.auto_id }}_error">{{ e }}</p>{% endfor %}
</div>{% endif %}
