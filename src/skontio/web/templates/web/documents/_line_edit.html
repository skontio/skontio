<tr class="editing">
  <td>{{ line.position }}</td>
  <td><label class="visually-hidden" for="le-text-{{ line.pk }}">Bezeichnung</label>
    <input id="le-text-{{ line.pk }}" name="text" value="{{ line.text }}" form="line-edit-{{ line.pk }}" required autofocus></td>
  <td class="num"><label class="visually-hidden" for="le-qty-{{ line.pk }}">Menge</label>
    <input class="narrow" id="le-qty-{{ line.pk }}" name="quantity" value="{{ line.quantity|floatformat:'-4' }}" inputmode="decimal" form="line-edit-{{ line.pk }}" required></td>
  <td class="num"><label class="visually-hidden" for="le-price-{{ line.pk }}">Einzelpreis</label>
    <input class="narrow" id="le-price-{{ line.pk }}" name="unit_price" value="{{ line.unit_price|floatformat:'-2' }}" inputmode="decimal" form="line-edit-{{ line.pk }}" required></td>
  <td class="num hide-small"><label class="visually-hidden" for="le-disc-{{ line.pk }}">Rabatt in Prozent</label>
    <input class="narrow" id="le-disc-{{ line.pk }}" name="discount_percent" value="{% if line.discount_percent %}{{ line.discount_percent|floatformat:'-2' }}{% endif %}" inputmode="decimal" placeholder="%" form="line-edit-{{ line.pk }}"></td>
  <td class="row-actions" colspan="2">
    <form id="line-edit-{{ line.pk }}" method="post" action="/dokumente/{{ doc.pk }}/positionen/{{ line.pk }}/"
          hx-post="/dokumente/{{ doc.pk }}/positionen/{{ line.pk }}/" hx-target="#lines" hx-swap="outerHTML">{% csrf_token %}
      <button type="submit">Speichern</button>
      <button type="button" class="link quiet" hx-get="/dokumente/{{ doc.pk }}/positionen/{{ line.pk }}/?abbrechen=1" hx-target="#lines" hx-swap="outerHTML">Abbrechen</button>
    </form>
  </td>
</tr>
