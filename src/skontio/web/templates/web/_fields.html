{% if form.non_field_errors %}<div class="errors" role="alert">{% for e in form.non_field_errors %}<p>{{ e }}</p>{% endfor %}</div>{% endif %}
{% for field in form %}
<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<small id="{{ field.auto_id }}_help">{{ field.help_text }}</small>{% endif %}
  {% for e in field.errors %}<p class="error" id="{{ field.auto_id }}_error">{{ e }}</p>{% endfor %}
</div>
{% endfor %}
